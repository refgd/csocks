version: "3.9"

services:
  csocks:
    image: refgd/csocks:v0.0.2
    container_name: csocks
    restart: always
    ports:
      - "7777:1080"
    volumes:
      - ./keys:/keys:ro
      - ./out:/out:rw
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    command: ["--secret", "123456", "--listen", "1080", "--key", "/keys/server.crt", "/keys/server.key", "--public_key", "/out/public.key", "--http"]